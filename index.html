<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Code Editor</title>
    <link rel="stylesheet" href="code-editor.css">
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
</head>

<body>
    <div class="container">
        <div class="left">
            <label for="html-code">
                <box-icon id="html-logo" type='logo' name='html5'></box-icon> HTML
                <p id="p1"></p>
                <p id="p2"></p>
                <p id="p3"></p>
            </label>
            <textarea id="html-code" onkeyup="run()"></textarea>

            <label for="css-code">
                <box-icon id="css-logo" name='css3' type='logo'></box-icon> CSS
                <p id="p1"></p>
                <p id="p2"></p>
                <p id="p3"></p>
            </label>
            <textarea id="css-code" onkeyup="run()"></textarea>

            <label for="js-code">
                <box-icon id="js-logo" name='javascript' type='logo'></box-icon> JAVASCRIPT
                <p id="p1"></p>
                <p id="p2"></p>
                <p id="p3"></p>
            </label>
            <textarea id="js-code" onkeyup="run()"></textarea>
        </div>
        <div class="right">
            <label><box-icon name='play-circle'></box-icon> Live Server<p id="p1"></p>
                <p id="p2"></p>
                <p id="p3"></p></label>
            <iframe id="output" frameborder="0"></iframe>
        </div>
    </div>
</body>
<script>
    function run() {
        let html_code = document.getElementById("html-code").value;
        let css_code = document.getElementById("css-code").value;
        let js_code = document.getElementById("js-code").value;
        let output = document.getElementById("output");

        output.contentDocument.body.innerHTML = html_code+"<style>"+ css_code +"</style>";
        output.contentWindow.eval(js_code);
    }
</script>

</html>
