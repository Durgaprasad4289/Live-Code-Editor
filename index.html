<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Code Editor</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1049/1049443.png">
    <link rel="stylesheet" href="code-editor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material.min.css">
</head>

<body>
    <div class="container">
        <div class="left">
            <label for="html-code">
                <box-icon id="html-logo" type='logo' name='html5'></box-icon> HTML
                <p id="p1"></p>
                <p id="p2"></p>
                <p id="p3"></p>
            </label>
            <textarea id="html-code" onkeyup="run()"></textarea>

            <label for="css-code">
                <box-icon id="css-logo" name='css3' type='logo'></box-icon> CSS
                <p id="p1"></p>
                <p id="p2"></p>
                <p id="p3"></p>
            </label>
            <textarea id="css-code" onkeyup="run()"></textarea>

            <label for="js-code">
                <box-icon id="js-logo" name='javascript' type='logo'></box-icon> JAVASCRIPT
                <p id="p1"></p>
                <p id="p2"></p>
                <p id="p3"></p>
            </label>
            <textarea id="js-code" onkeyup="run()"></textarea>
        </div>
        <div class="right">
            <label><box-icon name='play-circle'></box-icon> Live Server<p id="p1"></p>
                <p id="p2"></p>
                <p id="p3"></p>
            </label>
            <iframe id="output" frameborder="0"></iframe>
        </div>
    </div>
    <!-- CODE MINNOR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <!-- BOX ICONS  -->
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>

</body>
<script>
        const htmlEditor = CodeMirror.fromTextArea(
        document.getElementById("html-code"),
        {mode:"text/html", theme: "material", lineNumbers: true }
        );

        const cssEditor = CodeMirror.fromTextArea(
        document.getElementById("css-code"),
        {mode: "css", theme: "material", lineNumbers: true }
        );

        const jsEditor = CodeMirror.fromTextArea(
        document.getElementById("js-code"),
        {mode: "javascript", theme: "material", lineNumbers: true }
        );

        function run() {
            let html_code = htmlEditor.getValue();
        let css_code = cssEditor.getValue();
        let js_code = jsEditor.getValue();
        let output = document.getElementById("output");

        output.contentDocument.body.innerHTML =
        html_code + "<style>" + css_code + "</style>";

        output.contentWindow.eval(js_code);
    }

        htmlEditor.on("change", run);
        cssEditor.on("change", run);
        jsEditor.on("change", run);
</script>


</html>
